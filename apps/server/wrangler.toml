name = "vulgar-acts"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

# The game lives at the bare domain; www works too. Cloudflare makes the DNS records and certs itself.
routes = [
  { pattern = "vulgaracts.com", custom_domain = true },
  { pattern = "www.vulgaracts.com", custom_domain = true },
]

# The web app's production build is served as static assets from the same
# Worker, so phones talk to one address and there is no CORS.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "FEEDBACK"
class_name = "Feedback"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Feedback"]

[observability]
enabled = true

# Playtest feedback forms are read at /api/feedback?key=... : `npx wrangler secret put FEEDBACK_KEY`
# Optional analytics (DEPLOY.md step 5): set with `npx wrangler secret put POSTHOG_KEY`
# [vars]
# POSTHOG_HOST = "https://us.i.posthog.com"
