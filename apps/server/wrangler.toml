name = "vulgar-acts"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

# The game lives at the bare domain; www works too. Cloudflare makes the DNS records and certs itself.
routes = [
  { pattern = "vulgaracts.com", custom_domain = true },
  { pattern = "www.vulgaracts.com", custom_domain = true },
]

# The web app's production build is served as static assets from the same
# Worker, so phones talk to one address and there is no CORS.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Accounts and entitlements live in D1 (DEPLOY.md step 7). Create with `npx wrangler d1 create vulgar-acts`
# and paste the database_id here; apply the schema with `npm run db:migrate`.
[[d1_databases]]
binding = "DB"
database_name = "vulgar-acts"
database_id = "b9e5ded6-fb0a-4fe2-a4eb-1e9d07842fab"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true

# Granting decks by hand (founders, testers): `npx wrangler secret put ADMIN_KEY`, see DEPLOY.md step 8
# Sign-in emails go through Resend (DEPLOY.md step 7): `npx wrangler secret put RESEND_KEY`
[vars]
MAIL_FROM = "Vulgar Acts <info@vulgaracts.com>"
# Optional analytics (DEPLOY.md step 5): set with `npx wrangler secret put POSTHOG_KEY`
# [vars]
# POSTHOG_HOST = "https://us.i.posthog.com"
